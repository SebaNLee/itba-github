[project]
name = "distributed-lock"
version = "0.1.0"
description = "Lab service for distributed locking patterns (Redis-compatible backends)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
    "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers[redis]>=4.0",
]

[project.scripts]
distributed-lock = "distributed_lock.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["distributed_lock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

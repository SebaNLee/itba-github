# Sin storageClass: usa la StorageClass por defecto del cluster
# (default en AKS, standard en minikube).
persistence:
  size: 4Gi

auth:
  username: "username"
  password: "password"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# RabbitMQ salió del catálogo gratuito de Bitnami (agosto 2025): el chart quedó congelado en
# 16.0.14 y la imagen que trae por defecto (docker.io/bitnami/rabbitmq:4.1.3-debian-12-r1) ya no
# existe, así que sin esto el pod queda en ErrImagePull. La misma versión sigue publicada en
# bitnamilegacy, congelada y sin parches de seguridad: alcanza para un lab, no para producción.
# El chart se niega a renderizar si le cambiás la imagen, salvo que lo autorices explícitamente.
global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/rabbitmq

volumePermissions:
  image:
    repository: bitnamilegacy/os-shell

# Vitrina del álbum: nginx sirviendo HTML y config que vienen de un ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
  namespace: figuritas
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head><meta charset="utf-8"><title>Álbum Mundial 2026</title></head>
      <body style="font-family: sans-serif; text-align: center; margin-top: 15vh">
        <h1>Álbum Mundial 2026</h1>
        <p>Servido desde un cluster AKS. Mirá el header <code>X-Servido-Por</code> para saber qué pod respondió.</p>
      </body>
    </html>
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        add_header X-Servido-Por $hostname always;
      }
      location = /healthz {
        return 200 "ok\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: figuritas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.30
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: web
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: web
          configMap:
            name: web

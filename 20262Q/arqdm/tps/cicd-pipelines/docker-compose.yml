version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    networks: 
      - saga
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  akhq:
    image: tchiotludo/akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-server:
              properties:
                bootstrap.servers: "kafka:29092"
    ports:
      - 8080:8080
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - saga

  kafka:
    image: confluentinc/cp-kafka:latest
    networks: 
      - saga
    depends_on:
      - zookeeper
    ports:
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    networks: 
      - saga
    depends_on:
      - kafka
    ports:
      - 19000:9000
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      
  db:
    image: mysql:lts
    environment:
      - MYSQL_ROOT_PASSWORD=example
      - MYSQL_DATABASE=saga
    networks:
      - saga
    ports:
      - 3306:3306
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment:
    build:
      context: ./microservice-payment
    networks:
      - saga
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  inventory:
    build:
      context: ./microservice-inventory
    networks:
      - saga
    depends_on:
      db:
        condition: service_healthy 
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  sale:
    build:
      context: ./microservice-sale
    ports:
      - 8081:8081
    networks:
      - saga
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
        
networks:
  saga:
    driver: bridge
services:
  server:
    container_name: tickets_server
    image: tickets_server:latest
    build:
      context: ./server
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
  client:
    container_name: tickets_client
    image: tickets_client:latest
    build:
      context: ./client
    profiles: ["client"]
    depends_on:
      - server
    environment:
      SPRING_GRPC_CLIENT_CHANNELS_LOCAL_ADDRESS: "server:${GRPC_PORT}"
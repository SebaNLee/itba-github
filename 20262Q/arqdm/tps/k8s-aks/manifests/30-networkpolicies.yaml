# 1) Default deny: ningún pod del namespace recibe tráfico salvo que una policy lo permita.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: figuritas
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2) La web es pública: acepta el puerto 80 desde cualquier origen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-publica
  namespace: figuritas
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 80
---
# 3) A Postgres solo llegan los pods del namespace con la label acceso-db=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-solo-autorizados
  namespace: figuritas
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              acceso-db: "true"
      ports:
        - port: 5432
